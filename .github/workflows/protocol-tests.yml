name: Protocol tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run protocol tests
        run: python -m unittest discover -s tests -v
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run REFramework script tests
        run: |
          for test in tests/test*.lua; do
            lua5.4 "$test"
          done

  native_windows:
    needs: unittest
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get pinned REFramework headers
        uses: actions/checkout@v4
        with:
          repository: praydog/REFramework
          ref: d1461375aee4ec3f313170f8eaad12064eb542d9
          path: staging/sdk/reframework
          sparse-checkout: include
      - name: Get pinned Steam headers
        uses: actions/checkout@v4
        with:
          repository: ValveSoftware/source-sdk-2013
          ref: e1f1fd42271805072f052051c26c21caa2c87b04
          path: staging/sdk/source-sdk-2013
          sparse-checkout: src/public
      - name: Build native plugin and tests
        shell: pwsh
        run: |
          cmake -S network/steam_lobby_probe -B staging/native-build -A x64 "-DREFRAMEWORK_INCLUDE_DIR=$env:GITHUB_WORKSPACE/staging/sdk/reframework/include" "-DSTEAMWORKS_INCLUDE_DIR=$env:GITHUB_WORKSPACE/staging/sdk/source-sdk-2013/src/public"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build staging/native-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir staging/native-build -C Release --output-on-failure
          exit $LASTEXITCODE
      - name: Test Windows save protection and recovery
        shell: pwsh
        run: ./tests/test_save_storage_guard.ps1

      - name: Test Windows save-file sharing and process lifetime
        run: python -m unittest tests.test_campaign_save_copy tests.test_campaign_setup tests.test_save_file_guard tests.test_test_package tests.test_archive_package -v
      - name: Build and test Steam save barrier
        shell: pwsh
        run: |
          cmake -S network/steam_save_guard -B staging/save-guard-build -A x64 "-DREFRAMEWORK_INCLUDE_DIR=$env:GITHUB_WORKSPACE/staging/sdk/reframework/include"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build staging/save-guard-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir staging/save-guard-build -C Release --output-on-failure
          exit $LASTEXITCODE
      - name: Build and verify portable test package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = 'staging/package-cache'
          $null = New-Item -ItemType Directory -Path $cache -Force
          $archive = Join-Path $cache 'python-3.13.17-embed-amd64.zip'
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.13.17/python-3.13.17-embed-amd64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '9E35319BFFEDAB8B36AD44D8F377CB4F1733BCEC257A0B6D04D94F01486DDB38') { throw 'Pinned Python archive checksum mismatch' }
          python -B tools/test_package/build_package.py --output staging/test-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./staging/test-package/runtime/python.exe -B -c 'import test_mod; test_mod.verify_bundle(); print("Embedded package imports and hashes verified")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/test_package/archive_package.py --package staging/test-package --output "staging/distribution/RE2-Coop-Protected-$env:GITHUB_SHA.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Steam-start lobby package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "staging/distribution/RE2-Koop-Steam-$env:GITHUB_SHA.zip"
          python -B tools/test_package/build_steam_package.py --package staging/test-package --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $archive -DestinationPath staging/steam-package-smoke
          if (-not (Test-Path -LiteralPath staging/steam-package-smoke/re2-coop/scripts/protect_re2_test_saves.ps1 -PathType Leaf)) { throw 'Save supervisor missing from the Steam development archive' }
          $lobbyMenu = Get-Content -LiteralPath staging/steam-package-smoke/reframework/autorun/re2_coop_lobby.lua -Raw
          foreach ($marker in @('Spiel starten', 'campaign_start_ready', 'start-campaign', 'select-new-game')) {
            if (-not $lobbyMenu.Contains($marker)) { throw "Campaign start UI missing from Steam archive: $marker" }
          }
          & ./staging/steam-package-smoke/re2-coop/runtime/python.exe -B -c 'import campaign_save_copy, campaign_setup, campaign_start, checkpoint_workspace, guest_checkpoint_archive, checkpoint_transfer, checkpoint_transfer_binding, prepared_checkpoint, steam_snapshot_transfer, steam_pose_bridge; assert steam_pose_bridge._native_lobby_role("invite-pending") == b"G"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('autorun/re2_coop/new_game.lua', 'diagnostics/re2_coop_readonly_save_probe.lua', 'autorun/re2_coop/checkpoint_catalog.lua', 'autorun/re2_coop/checkpoint_admission.lua', 'autorun/re2_coop/cutscenes.lua', 'autorun/re2_coop/cutscene_test_peer.lua', 'autorun/re2_coop_cutscenes.lua', 'autorun/re2_coop_guest_preview.lua')) {
            $installed = $file.Replace('diagnostics/', 'autorun/')
            if ((Get-FileHash "reframework/$file").Hash -ne (Get-FileHash "staging/steam-package-smoke/reframework/$installed").Hash) {
              throw "Packaged REFramework script differs from source: $file"
            }
          }
          & ./staging/steam-package-smoke/re2-coop/runtime/python.exe -B -c 'import pathlib, sys, unittest, steam_pose_bridge, checkpoint_workspace, guest_checkpoint_archive, checkpoint_transfer, checkpoint_transfer_binding; assert all(pathlib.Path(m.__file__).resolve().parent == pathlib.Path("staging/steam-package-smoke/re2-coop").resolve() for m in (steam_pose_bridge, checkpoint_workspace, guest_checkpoint_archive, checkpoint_transfer, checkpoint_transfer_binding)); sys.path.append(str(pathlib.Path.cwd())); unittest.main(module=None, argv=["unittest", "tests.test_new_game_bridges", "tests.test_cutscene_link", "tests.test_checkpoint_workspace", "tests.test_guest_checkpoint_archive", "tests.test_checkpoint_transfer", "tests.test_checkpoint_transfer_binding"])'
          exit $LASTEXITCODE
      - name: Upload Steam-start lobby package
        uses: actions/upload-artifact@v4
        with:
          name: re2-koop-steam-${{ github.sha }}
          path: |
            staging/distribution/RE2-Koop-Steam-${{ github.sha }}.zip
            staging/distribution/RE2-Koop-Steam-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload shared test package
        id: test_package
        uses: actions/upload-artifact@v4
        with:
          name: re2-coop-test-${{ github.sha }}
          path: |
            staging/distribution/RE2-Coop-Protected-${{ github.sha }}.zip
            staging/distribution/RE2-Coop-Protected-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Link test package in job summary
        shell: pwsh
        env:
          TEST_PACKAGE_URL: ${{ steps.test_package.outputs.artifact-url }}
        run: |
          "[Gemeinsames Testpaket herunterladen]($env:TEST_PACKAGE_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Quellcommit: $env:GITHUB_SHA. ZIP und SHA-256-Datei gehören zusammen. Beide PCs verwenden denselben Download." >> $env:GITHUB_STEP_SUMMARY
          'Build, Import und Paketchecks ersetzen keine native Zwei-Konten-Abnahme.' >> $env:GITHUB_STEP_SUMMARY
