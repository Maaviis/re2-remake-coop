name: Protocol tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run protocol tests
        run: python -m unittest discover -s tests -v
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run REFramework script tests
        run: |
          for test in tests/test*.lua; do
            lua5.4 "$test"
          done

  native_windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get pinned REFramework headers
        uses: actions/checkout@v4
        with:
          repository: praydog/REFramework
          ref: d1461375aee4ec3f313170f8eaad12064eb542d9
          path: staging/sdk/reframework
          sparse-checkout: include
      - name: Get pinned Steam headers
        uses: actions/checkout@v4
        with:
          repository: ValveSoftware/source-sdk-2013
          ref: e1f1fd42271805072f052051c26c21caa2c87b04
          path: staging/sdk/source-sdk-2013
          sparse-checkout: src/public
      - name: Build native plugin and tests
        shell: pwsh
        run: |
          cmake -S network/steam_lobby_probe -B staging/native-build -A x64 "-DREFRAMEWORK_INCLUDE_DIR=$env:GITHUB_WORKSPACE/staging/sdk/reframework/include" "-DSTEAMWORKS_INCLUDE_DIR=$env:GITHUB_WORKSPACE/staging/sdk/source-sdk-2013/src/public"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build staging/native-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir staging/native-build -C Release --output-on-failure
          exit $LASTEXITCODE
      - name: Test Windows save protection and recovery
        shell: pwsh
        run: ./tests/test_save_storage_guard.ps1
