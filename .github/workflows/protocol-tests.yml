name: Protocol tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run protocol tests
        run: python -m unittest discover -s tests -v
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run REFramework script tests
        run: |
          lua5.4 tests/test_observer_lua.lua
          lua5.4 tests/test_guest_pose_lua.lua
          lua5.4 tests/test_remote_motion_lua.lua

